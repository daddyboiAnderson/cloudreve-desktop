name: Platform builds

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: ui
        run: yarn build

      - name: Compile desktop application
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Test sync service
        run: cargo test -p cloudreve-sync --lib

      - name: Test desktop commands
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Test macOS upload encryption
        if: runner.os == 'macOS'
        run: ./macos/scripts/test-upload-encryption.sh

      - name: Test macOS state migration
        if: runner.os == 'macOS'
        run: bash macos/scripts/test-state-database.sh

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles app

      - name: Embed File Provider extension
        if: runner.os == 'macOS'
        env:
          FP_CONFIGURATION: Release
          FP_REGISTER_EXTENSION: '0'
          FP_BUILD_NUMBER: '${{ github.run_number }}'
          FP_SHORT_VERSION: '0.2.1'
        run: |
          bash macos/scripts/embed-into-app.sh
          codesign --verify --deep --strict target/release/bundle/macos/Cloudreve.app
          tar -czf Cloudreve-macOS.app.tar.gz -C target/release/bundle/macos Cloudreve.app

      - name: Upload macOS test application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Cloudreve-macOS
          path: Cloudreve-macOS.app.tar.gz
          if-no-files-found: error
          retention-days: 14
