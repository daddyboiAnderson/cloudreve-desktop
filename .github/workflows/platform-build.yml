name: Platform builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: ui
        run: yarn build

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Compile desktop application
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Compile macOS File Provider extension
        if: runner.os == 'macOS'
        env:
          FP_CONFIGURATION: Release
        run: ./macos/scripts/build-extension.sh

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles app

      - name: Embed File Provider extension
        if: runner.os == 'macOS'
        run: |
          app="target/release/bundle/macos/Cloudreve.app"
          mkdir -p "$app/Contents/PlugIns"
          cp -R macos/build/CloudreveFileProvider.appex "$app/Contents/PlugIns/"
          codesign --force --sign - --timestamp=none "$app"
          ditto -c -k --keepParent "$app" Cloudreve-macOS.zip

      - name: Upload macOS test application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Cloudreve-macOS
          path: Cloudreve-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows test executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Cloudreve-Windows
          path: target/debug/cloudreve-desktop.exe
          if-no-files-found: error
          retention-days: 14
